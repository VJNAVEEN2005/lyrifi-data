name: Automated Daily Tamil Lyrics Ingestion

on:
  schedule:
    # Runs every day at 00:30 UTC (06:00 AM IST)
    - cron: '30 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Scraper Engine
        run: |
          python scraper/scrape_engine.py

      - name: Commit and push new songs if updated
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add scraper/scraped_songs.json src/scrapedData.ts
          if git diff --staged --quiet; then
            echo 'No new songs scraped today.'
          else
            git commit -m 'chore(data): auto-scraped latest Tamil songs [skip ci]'
            git push
          fi
